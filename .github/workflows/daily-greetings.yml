name: Avani Daily Morning Greetings

on:
  schedule:
    # Runs daily at 7:00 AM IST (1:30 AM UTC)
    # Cron format: minute hour day-of-month month day-of-week (in UTC)
    - cron: '30 1 * * *'
  # Enables manual trigger from GitHub Actions UI ("Run workflow" button)
  workflow_dispatch:

jobs:
  dispatch-morning-greetings:
    name: Trigger Festival & Birthday Greetings
    runs-on: ubuntu-latest
    steps:
      - name: Send Morning Greetings Trigger to Render
        run: |
          echo "========================================================"
          echo "Triggering Avani Daily Morning Greetings (7:00 AM IST)..."
          echo "Time (UTC): $(date -u)"
          echo "========================================================"
          
          # Use curl with retry mechanism to gracefully handle Render cold starts
          RESPONSE=$(curl -s -S -L \
            --retry 3 \
            --retry-delay 15 \
            --max-time 120 \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            "https://avani-backend-z7ef.onrender.com/api/notifications/trigger-daily-greetings")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -n 's/^HTTP_STATUS://p')
          
          echo "Backend Response: $HTTP_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Daily morning greetings processed successfully."
            exit 0
          else
            echo "ERROR: Unexpected status code $HTTP_STATUS"
            exit 1
          fi
